<h1 mat-dialog-title>Create delegation
  <button matSuffix type="button" mat-icon-button class="btn btn-danger" (click)="cancel()" >
    <mat-icon style="padding-bottom: 8px;">close</mat-icon>
  </button>
</h1>
<div class="input-group">
  <mat-form-field appearance="outline" fxFlex="100">
    <input matInput type="text" class="form-control" placeholder="Delegation name"
           aria-describedby="delegationName"
           [(ngModel)]="resultData.name" autofocus name="delegationName">
  </mat-form-field>
</div>
<h1 mat-dialog-title>Add organisations</h1>
<div mat-dialog-content>
  <div class="flex" fxLayout="row wrap" fxLayout.xs="column" fxLayoutGap="16px grid" fxLayoutAlign="start">
    <mat-form-field appearance="outline" fxFlex="100">
      <mat-label>Search</mat-label>
      <input matInput [(ngModel)]="searchData" (keyup.enter)="search()" placeholder="Search">
      <button mat-button *ngIf="searchData" matSuffix mat-icon-button aria-label="Clear" (click)="clear()">
        <mat-icon>close</mat-icon>
      </button>
    </mat-form-field>
  </div>
  <br>
  <div class="scroll-box-400 form-control" appearance="outline">
    <div *ngFor="let match of searchResults"
         class="hover-box show-child-on-hover striped">
      {{ match.name }}
      <button matSuffix type="button" mat-icon-button class="btn pull-right"
              (click)="addToSelection(match)">
        <span class="fa fa-sm fa-plus"></span>
      </button>
    </div>
  </div>
  <br>
  <div *ngIf="selectedOrg" class="scroll-box-150 form-control">
    <h1 mat-dialog-title>Matches</h1>
    <div class="hover-box show-child-on-hover striped">
      {{ selectedOrg.name }}
      <button type="button" class="btn btn-xs btn-danger pull-right child-to-show" (click)="removeFromSelection(selectedOrg)">
        <span class="fa fa-sm fa-remove"></span>
      </button>
    </div>
  </div>
</div>
<div mat-dialog-actions align="end">
  <button mat-button color="accent" (click)="cancel()">Cancel</button>
  <button mat-flat-button color="accent" (click)="ok()">Add selected</button>
</div>
