version: 0.2

phases:
  install:
    runtime-versions:
      java: openjdk8
  pre_build:
    commands:
      - IP=$(curl http://checkip.amazonaws.com)/32
      - echo $IP of CodeBuild Instance
      - aws s3 cp s3://endeavour-codebuild/settings/settings.xml /root/.m2/settings.xml
  build:
    commands:
      - chmod +x aws_scripts/build.sh
      - echo Main build started on `date`
      - aws_scripts/build.sh mvn -B deploy
      - echo Analysis started on `date`
  post_build:
    commands:
      - IP=$(curl http://checkip.amazonaws.com)/32
      - echo $IP of CodeBuild Instance
      - echo Packaging application
      - cd FrontEnd
      - zip -r frontend.zip appspec.yml cleanup dist/
      - mv frontend.zip frontend
      - cd ../FrontEndv8
      - zip -r frontendv8.zip appspec.yml cleanup dist/
      - mv frontendv8.zip frontendv8
      - echo Packaging core
      - cd ../API
      - zip -r api.zip appspec.yml cleanup permissions target/API-0.0.1/
      - mv api.zip api
      - echo Build completed on `date`
artifacts:
  files:
    - FrontEnd/frontend
    - FrontEndv8/frontendv8
    - API/api
  discard-paths: yes

